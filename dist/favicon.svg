<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="favGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5b769;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a058;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Small U monogram favicon -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="url(#favGoldGradient)" stroke-width="1.5"/>
  
  <!-- Mini U -->
  <path d="M 10 10 L 10 22 M 22 10 L 22 22 M 10 22 Q 16 26 22 22" 
        stroke="url(#favGoldGradient)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Spark particle -->
  <circle cx="16" cy="16" r="1" fill="#e5b769" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.4;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
