<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5b769;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a058;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle for the U monogram -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main U monogram - stylized with a creative spark -->
  <g transform="translate(0, 10)">
    <!-- Left vertical stroke of U -->
    <path d="M 45 35 L 45 145" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Right vertical stroke of U -->
    <path d="M 155 35 L 155 145" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Curved bottom of U -->
    <path d="M 45 145 Q 100 180 155 145" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    
    <!-- Creative/AI spark - a subtle lightning bolt inside the U -->
    <path d="M 85 95 L 92 95 L 92 88 L 99 88 L 99 81 L 106 81 L 106 95 L 113 95 L 113 102 L 120 102 L 120 95" 
          fill="none" stroke="#e5b769" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    
    <!-- Spark particles around the U -->
    <circle cx="75" cy="75" r="2" fill="#e5b769" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="75" r="2" fill="#e5b769" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="125" r="2" fill="#e5b769" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="125" r="2" fill="#e5b769" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Decorative outer ring with subtle pulse -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#e5b769" stroke-width="1" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.2;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
